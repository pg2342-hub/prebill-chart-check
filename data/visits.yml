# 30 synthetic urgent care visits. Every patient, clinic, clinician and note is made up.
# `billed` is the draft claim as it would leave the EHR. `truth` is the hand-labeled
# reading of the note (AMA 2021 office/outpatient MDM elements), and `expected` is the
# answer key: the findings a careful coder would raise and where the visit should go.
#
# MDM element levels: minimal, low, moderate, high ("minimal" also covers none).
# Actions: release (claim goes out as is), auto_fix (a simple claim fix, applied once the
# category has passed shadow mode), route_clinician (the clinician decides in the EHR),
# hold (note not signed; nothing leaves).

